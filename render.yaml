services:
  - type: web
    name: drug-interaction-alert-system
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: dias-db
          property: connectionString

databases:
  - name: dias-db
    plan: free
    region: oregon
    databaseName: dias_db
    user: dias_user